name: Build & Test

on:
  push:
    branches: [ "develop", "production" ]
  pull_request:
    branches: [ "develop", "production" ]
  workflow_dispatch:

jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  test-ios:
    name: Test iOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: List package schemes
        run: xcodebuild -list
      - name: Run tests
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $2 ~ /^[0-9A-F-]+$/ { print $2; exit }')"
          if [ -z "$device_id" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          xcodebuild test \
            -scheme SwiftPath \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath .build/xcodebuild/iOS \
            CODE_SIGNING_ALLOWED=NO

  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
